<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img"
    aria-label="Konnexio hero gradient">
    <defs>
        <linearGradient id="redToGrey" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0%" stop-color="#b31317" />
            <stop offset="66.666%" stop-color="#b31317" />
            <stop offset="100%" stop-color="#e6e6e6" />
        </linearGradient>
    </defs>

    <!-- simple horizontal gradient from red to light grey -->
    <rect width="100%" height="100%" fill="url(#redToGrey)" />

</svg>